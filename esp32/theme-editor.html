<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محرر شاشة حد السرعة</title>
<style>
  :root { --bg:#0f1318; --panel:#171d25; --line:#2a323d; --text:#e8edf3; --muted:#8a96a5; --accent:#3d9bff; --ok:#2fb35a; }
  :root[data-theme="light"] { --bg:#f1f3f6; --panel:#ffffff; --line:#d5dae1; --text:#1a2029; --muted:#5d6978; --accent:#0a6cdc; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f1f3f6; --panel:#ffffff; --line:#d5dae1; --text:#1a2029; --muted:#5d6978; --accent:#0a6cdc; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI",Tahoma,system-ui,sans-serif; line-height:1.5; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header h1 { font-size:18px; margin:0 0 0 auto; margin-inline-end:auto; }
  button, .btn { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:16px; padding:16px; max-width:1500px; margin:0 auto; }
  @media (max-width:980px) { main { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stage { display:flex; flex-direction:column; align-items:center; gap:10px; position:sticky; top:64px; align-self:start; }
  .screenwrap { background:#000; padding:14px; border-radius:50%; }
  .screenwrap.square { border-radius:14px; }
  canvas#main { display:block; width:min(86vw,520px); height:min(86vw,520px); image-rendering:pixelated; border-radius:50%; cursor:crosshair; background:#000; }
  .square canvas#main { border-radius:0; }
  .readout { font-family:Consolas,monospace; color:var(--muted); font-size:14px; min-height:22px; direction:ltr; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; margin-top:6px; }
  .thumb { text-align:center; font-size:12px; color:var(--muted); cursor:pointer; border:2px solid transparent; border-radius:10px; padding:4px; }
  .thumb.on { border-color:var(--accent); color:var(--text); }
  .thumb canvas { width:96px; height:96px; image-rendering:pixelated; border-radius:50%; background:#000; display:block; margin:0 auto 4px; }
  details { border-top:1px solid var(--line); padding:6px 0; }
  details:first-of-type { border-top:0; }
  summary { cursor:pointer; font-weight:600; padding:6px 0; }
  .ctl { display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; padding:5px 0; }
  .ctl label { font-size:14px; }
  .ctl .hint { grid-column:1/-1; color:var(--muted); font-size:12px; direction:ltr; text-align:start; margin-top:-2px; }
  .ctl .inp { display:flex; gap:6px; align-items:center; direction:ltr; }
  input[type=number] { width:70px; }
  input[type=text] { width:150px; }
  input[type=number], input[type=text] { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  input[type=color] { width:44px; height:30px; border:1px solid var(--line); border-radius:6px; background:none; padding:2px; }
  input[type=range] { width:110px; }
  .hex { font-family:Consolas,monospace; font-size:13px; color:var(--muted); width:70px; }
  .changed label::after { content:" •"; color:var(--accent); }
  textarea { width:100%; min-height:120px; font-family:Consolas,monospace; font-size:12px; direction:ltr; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; max-width:640px; width:92vw; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ok); color:#fff; padding:8px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .note { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>محرر شاشة حد السرعة</h1>
  <button class="primary" id="save">حفظ theme.h</button>
  <button id="copy">نسخ</button>
  <button id="import">استيراد</button>
  <button id="reset">رجوع للأصلي</button>
</header>

<main>
  <section class="card stage">
    <div class="screenwrap" id="wrap"><canvas id="main" width="240" height="240"></canvas></div>
    <div class="readout" id="readout">حرّك الماوس على الشاشة لمعرفة الإحداثيات (x, y)</div>
    <div class="row">
      <button id="shape">عرض مربع/دائري</button>
      <span class="note" id="stateName"></span>
    </div>
    <div class="thumbs" id="thumbs" style="width:100%"></div>
    <p class="note">المعاينة تستخدم نفس الخط ونفس خوارزمية الرسم الموجودة في الجهاز. الدائرة الحقيقية 240×240، ومركزها (120, 120).</p>
  </section>

  <aside class="card" id="controls"></aside>
</main>

<dialog id="dlg">
  <form method="dialog">
    <p>الصق محتوى ملف theme.h هنا، أو اختر الملف:</p>
    <textarea id="paste"></textarea>
    <p><input type="file" id="file" accept=".h,.txt"></p>
    <div class="row" style="justify-content:flex-end">
      <button value="cancel">إلغاء</button>
      <button class="primary" id="doImport" value="ok">استيراد</button>
    </div>
  </form>
</dialog>

  const out = base.lines.slice();
  for (const it of base.items) {
    const v = V[it.name], tok = TYPE[it.name] === 'text' ? '"' + v + '"' : TYPE[it.name] === 'color' ? '0x' + (v & 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0') : String(v);
    out[it.line] = out[it.line].replace(LINE_RE, (m, a, name, sp) => a + name + sp + tok + m.slice((a + name + sp + it.raw).length));
  }
  return out.join('\n');
}

// ---- a tiny software screen that draws exactly like the device ----
const W = 240;
const px = new Uint32Array(W * W);
const q565 = c => { const r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
  const r5 = r >> 3, g6 = g >> 2, b5 = b >> 3;   // what the 16-bit screen can really show
  return (0xFF000000 | (((b5 << 3) | (b5 >> 2)) << 16) | (((g6 << 2) | (g6 >> 4)) << 8) | ((r5 << 3) | (r5 >> 2))) >>> 0; };
function dot(x, y, c) { if (x >= 0 && y >= 0 && x < W && y < W) px[y * W + x] = c; }
function fillRect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) dot(x + i, y + j, c); }
function drawRect(x, y, w, h, c) { for (let i = 0; i < w; i++) { dot(x + i, y, c); dot(x + i, y + h - 1, c); } for (let j = 0; j < h; j++) { dot(x, y + j, c); dot(x + w - 1, y + j, c); } }
function fillCircle(cx, cy, r, c) { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r) dot(cx + x, cy + y, c); }
function fillArc(cx, cy, r1, r2, start, end, c) {
  if (r1 < r2) [r1, r2] = [r2, r1];
  const ir = r2 - 1, ir2 = ir * ir + ir, or2 = r1 * r1 + r1;
  const norm = a => ((a % 360) + 360) % 360, s = norm(start), e = norm(end);
  for (let y = -r1; y <= r1; y++) for (let x = -r1; x <= r1; x++) {
    const d = x * x + y * y; if (d < ir2 || d >= or2) continue;
    const a = norm(Math.atan2(y, x) * 180 / Math.PI);
    if (s <= e ? (a >= s && a <= e) : (a >= s || a <= e)) dot(cx + x, cy + y, c);
  }
}
function drawText(str, cx, cy, size, fg, bg) {
  const w = 6 * size * str.length, h = 8 * size; let x0 = cx - Math.trunc(w / 2), y0 = cy - Math.trunc(h / 2);
  for (const ch of str) {
    const code = ch.charCodeAt(0) & 255;
    fillRect(x0 + 5 * size, y0, size, h, bg);                    // spacing column
    for (let i = 0; i < 5; i++) { const col = FONT[code * 5 + i];
      for (let j = 0; j < 8; j++) fillRect(x0 + i * size, y0 + j * size, size, size, (col >> j) & 1 ? fg : bg); }
    x0 += 6 * size;
  }
}
const col = n => q565(V[n]);

// state: {limit, est, speed, msg, used, view, flash}; msg: none | nosd | nomap | nogps | nodata | offmap
function drawScreen(st) {
  const limit = st.limit, flash = !!st.flash;
  const face = q565(flash ? V.COL_FLASH_FACE : V.COL_SIGN_FACE);
  const tLimit = flash ? col('COL_FLASH_TEXT') : col('COL_LIMIT_TEXT'), tMuted = flash ? col('COL_FLASH_TEXT') : col('COL_MUTED_TEXT');
  px.fill(col('COL_BG'));
  const ring = limit === 0 ? col('COL_RING_UNKNOWN') : col('COL_RING');
  if (st.est && limit) {
    for (let i = 0; i < V.DASH_COUNT; i++) { const a = V.DASH_START_DEG + i * 360 / V.DASH_COUNT; fillArc(V.SIGN_CX, V.SIGN_CY, V.SIGN_R_IN, V.SIGN_R_OUT, a, a + V.DASH_LEN_DEG, ring); }
  } else fillCircle(V.SIGN_CX, V.SIGN_CY, V.SIGN_R_OUT, ring);
  fillCircle(V.SIGN_CX, V.SIGN_CY, V.SIGN_R_IN, face);
  const T = (s, dy, size, fg) => drawText(s, V.SIGN_CX, V.SIGN_CY + dy, size, fg, face);
  if (limit) {
    T(String(limit), V.LIMIT_DY, limit >= 100 ? V.LIMIT_SIZE_3DIGIT : V.LIMIT_SIZE_2DIGIT, tLimit);
    if (st.est) T(V.TXT_EST, V.EST_DY, V.EST_SIZE, tMuted);
  } else {
    const names = { nosd:'TXT_NO_SD', nomap:'TXT_NO_MAP', nogps:'TXT_NO_GPS', nodata:'TXT_NO_DATA', offmap:'TXT_OFF_MAP' };
    const m = names[st.msg] ? V[names[st.msg]] : V.TXT_UNKNOWN, muted = col('COL_MUTED_TEXT');
    if (st.msg === 'nogps' || st.msg === 'nodata') {
      T(m, V.MSG_DY_SEARCH, V.MSG_SIZE, muted);
      if (st.msg === 'nodata') { T(V.TXT_CHECK1, V.CHECK1_DY, V.CHECK_SIZE, muted); T(V.TXT_CHECK2, V.CHECK2_DY, V.CHECK_SIZE, muted); }
      else {
        T(V.TXT_SAT_PREFIX + ' ' + st.used + '/' + st.view, V.SAT_TEXT_DY, V.SAT_TEXT_SIZE, col('COL_SAT_TEXT'));
        const bars = st.used >= 9 ? 4 : st.used >= 6 ? 3 : st.used >= 4 ? 2 : st.used >= 1 ? 1 : 0;
        for (let i = 0; i < 4; i++) { const hh = V.BAR_H0 + i * V.BAR_H_STEP, x = V.SIGN_CX + V.BAR_X0 + i * V.BAR_STEP, y = V.SIGN_CY + V.BAR_BASE_DY - hh;
          if (i < bars) fillRect(x, y, V.BAR_W, hh, col(st.used >= 4 ? 'COL_BAR_OK' : 'COL_BAR_WARN')); else drawRect(x, y, V.BAR_W, hh, col('COL_BAR_EMPTY')); }
      }
    } else if (st.msg === 'none') T(m, V.LIMIT_DY, V.LIMIT_SIZE_2DIGIT, muted);
    else T(m, V.MSG_DY_SIMPLE, V.MSG_SIZE, muted);
  }
  // your speed goes under the limit, except while there is no GPS fix or no map
  if (!['nogps', 'nodata', 'nosd', 'nomap'].includes(st.msg)) {
    drawText(String(st.speed), V.SPEED_CX, V.SPEED_Y, V.SPEED_SIZE, flash ? col('COL_FLASH_TEXT') : col('COL_SPEED_TEXT'), face);
    drawText(V.TXT_UNIT, V.UNIT_CX, V.UNIT_Y, V.UNIT_SIZE, flash ? col('COL_FLASH_TEXT') : col('COL_UNIT_TEXT'), face);
  }
}
function paint(canvas, st) {
  drawScreen(st);
  const ctx = canvas.getContext('2d'), img = ctx.createImageData(W, W);
  new Uint32Array(img.data.buffer).set(px); ctx.putImageData(img, 0, 0);
}

// ---- the screens the device can show ----
const STATES = [
  { n:'حد مسجّل 60', limit:60, est:false, speed:48, msg:'none', used:9, view:14 },
  { n:'حد تقديري 60', limit:60, est:true, speed:48, msg:'none', used:9, view:14 },
  { n:'تجاوز: الطور الأبيض', limit:80, est:false, speed:92, msg:'none', used:9, view:14 },
  { n:'تجاوز: الطور الأحمر', limit:80, est:false, speed:92, msg:'none', used:9, view:14, flash:true },
  { n:'تجاوز تقديري: أحمر', limit:60, est:true, speed:75, msg:'none', used:9, view:14, flash:true },
  { n:'حد 3 خانات', limit:120, est:false, speed:112, msg:'none', used:9, view:14 },
  { n:'3 خانات: الطور الأحمر', limit:120, est:false, speed:135, msg:'none', used:9, view:14, flash:true },
  { n:'بدون حد', limit:0, est:false, speed:35, msg:'none', used:9, view:14 },
  { n:'NO GPS (3 أقمار)', limit:0, est:false, speed:0, msg:'nogps', used:3, view:8 },
  { n:'NO GPS (7 أقمار)', limit:0, est:false, speed:0, msg:'nogps', used:7, view:14 },
  { n:'NO GPS (0 أقمار)', limit:0, est:false, speed:0, msg:'nogps', used:0, view:0 },
  { n:'NO DATA', limit:0, est:false, speed:0, msg:'nodata', used:0, view:0 },
  { n:'OFF MAP', limit:0, est:false, speed:50, msg:'offmap', used:9, view:14 },
  { n:'NO MAP', limit:0, est:false, speed:0, msg:'nomap', used:0, view:0 },
  { n:'NO SD', limit:0, est:false, speed:0, msg:'nosd', used:0, view:0 }
];
let cur = 0;

// ---- UI ----
const $ = id => document.getElementById(id);
const main = $('main'), thumbs = $('thumbs');
STATES.forEach((s, i) => { const d = document.createElement('div'); d.className = 'thumb'; d.innerHTML = '<canvas width="240" height="240"></canvas>' + s.n; d.onclick = () => { cur = i; redraw(); }; thumbs.appendChild(d); s.el = d; s.cv = d.firstChild; });
function redraw() {
  paint(main, STATES[cur]); $('stateName').textContent = STATES[cur].n;
  STATES.forEach((s, i) => { paint(s.cv, s); s.el.classList.toggle('on', i === cur); });
  try { localStorage.setItem('speedlimit-theme-v2', JSON.stringify(V)); } catch (e) {}
  document.querySelectorAll('.ctl').forEach(el => el.classList.toggle('changed', V[el.dataset.k] !== DEFAULTS[el.dataset.k]));
}
function setV(k, v, from) { V[k] = v; redraw(); syncControls(from); }
const ctlEls = {};
function buildControls() {
  const box = $('controls'); box.innerHTML = ''; let det = null, last = null, n = 0;
  for (const it of base.items) {
    if (it.section !== last) { det = document.createElement('details'); if (n++ === 0) det.open = true;
      det.innerHTML = '<summary>' + secName(it.section) + '</summary>'; box.appendChild(det); last = it.section; }
    const k = it.name, lab = LABELS[k] || [k], t = TYPE[k];
    const row = document.createElement('div'); row.className = 'ctl'; row.dataset.k = k;
    row.innerHTML = '<label>' + lab[0] + '</label><div class="inp"></div><div class="hint">' + k + (it.comment ? ' — ' + it.comment : '') + '</div>';
    const inp = row.querySelector('.inp'); ctlEls[k] = {};
    if (t === 'color') {
      const c = document.createElement('input'); c.type = 'color'; const h = document.createElement('input'); h.type = 'text'; h.className = 'hex'; h.style.width = '78px';
      c.oninput = () => setV(k, parseInt(c.value.slice(1), 16), c);
      h.onchange = () => { const m = h.value.trim().replace('#', '').match(/^[0-9a-fA-F]{6}$/); if (m) setV(k, parseInt(m[0], 16)); else syncControls(); };
      inp.append(c, h); ctlEls[k] = { c, h };
    } else if (t === 'num') {
      const mn = lab[1] ?? -300, mx = lab[2] ?? 600;
      const r = document.createElement('input'); r.type = 'range'; r.min = mn; r.max = mx; const nb = document.createElement('input'); nb.type = 'number';
      r.oninput = () => setV(k, +r.value, r); nb.oninput = () => { if (nb.value !== '' && !isNaN(+nb.value)) setV(k, Math.round(+nb.value), nb); };
      inp.append(r, nb); ctlEls[k] = { r, nb };
    } else {
      const x = document.createElement('input'); x.type = 'text'; x.maxLength = 12;
      x.oninput = () => { x.value = x.value.replace(/[^\x20-\x7E]/g, '').replace(/["\\]/g, ''); setV(k, x.value, x); };
      inp.append(x); ctlEls[k] = { x };
    }
    det.appendChild(row);
  }
  syncControls();
}
function syncControls(skip) {
  for (const k in ctlEls) { const e = ctlEls[k], v = V[k];
    if (e.c) { if (e.c !== skip) e.c.value = hex6(v); if (e.h !== document.activeElement) e.h.value = hex6(v).toUpperCase(); }
    if (e.r) { if (e.r !== skip) e.r.value = v; if (e.nb !== skip) e.nb.value = v; }
    if (e.x && e.x !== skip) e.x.value = v; }
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

$('save').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([exportTheme()], { type: 'text/plain' })); a.download = 'theme.h'; a.click(); toast('تم حفظ theme.h في مجلد التنزيلات'); };
$('copy').onclick = async () => { try { await navigator.clipboard.writeText(exportTheme()); toast('تم النسخ'); } catch (e) { $('paste').value = exportTheme(); $('dlg').showModal(); } };
$('reset').onclick = () => { if (confirm('ترجع كل القيم للأصلي؟')) { Object.assign(V, DEFAULTS); redraw(); syncControls(); } };
$('import').onclick = () => { $('paste').value = ''; $('dlg').showModal(); };
$('file').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => { $('paste').value = t; }); };
$('doImport').onclick = () => { const p = parseTheme($('paste').value); let n = 0;
  for (const it of p.items) if (it.name in V) { V[it.name] = TYPE[it.name] === 'text' ? it.raw.slice(1, -1) : TYPE[it.name] === 'color' ? parseInt(it.raw, 16) : parseInt(it.raw, 10); n++; }
  redraw(); syncControls(); toast('تم استيراد ' + n + ' قيمة'); };
$('shape').onclick = () => { $('wrap').classList.toggle('square'); document.querySelectorAll('.thumb canvas').forEach(c => c.style.borderRadius = $('wrap').classList.contains('square') ? '0' : '50%'); };
main.onmousemove = e => { const r = main.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * W);
  $('readout').textContent = 'x = ' + x + '   y = ' + y + '   (من مركز اللوحة: dx = ' + (x - V.SIGN_CX) + ', dy = ' + (y - V.SIGN_CY) + ')'; };
main.onmouseleave = () => { $('readout').textContent = 'حرّك الماوس على الشاشة لمعرفة الإحداثيات (x, y)'; };

try { const saved = JSON.parse(localStorage.getItem('speedlimit-theme-v2') || 'null'); if (saved) for (const k in saved) if (k in V && typeof saved[k] === typeof V[k]) V[k] = saved[k]; } catch (e) {}
buildControls(); redraw();
</script>
