# Builds the Android app on every push and publishes the APK as a GitHub Release.
# Latest APK: https://github.com/<owner>/<repo>/releases/latest/download/speed-limit.apk
name: Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Same signing key every build, so a new APK installs over the old one
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Create Android project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npx cap add android
          node scripts/patch-native.mjs android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../speed-limit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: speed-limit-android
          path: speed-limit.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" speed-limit.apk \
            --title "حد السرعة 1.0.${{ github.run_number }}" \
            --notes "نسخة أندرويد تجريبية. نزّل ملف speed-limit.apk من الجوال وثبّته." \
            --latest
