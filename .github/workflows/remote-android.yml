# Builds the phone app for the device (remote/) and publishes the APK as a GitHub Release.
# APKs: https://github.com/<owner>/<repo>/releases  (tags remote-v1.0.N)
name: Remote app (Android)

on:
  push:
    branches: [main, master, remote-app]
    paths: ['remote/**', '.github/workflows/remote-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Same signing key every build, so a new APK installs over the old one
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Create Android project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npx cap add android
          node scripts/patch-native.mjs
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        working-directory: remote/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../speed-limit-remote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: speed-limit-remote-android
          path: remote/speed-limit-remote.apk

      # Does not take the "Latest" label, so the other app's download link keeps working
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: remote
        run: |
          gh release create "remote-v1.0.${{ github.run_number }}" speed-limit-remote.apk \
            --title "قطعة حد السرعة 1.0.${{ github.run_number }}" \
            --notes "تطبيق التحكم بالقطعة (بلوتوث). نزّل ملف speed-limit-remote.apk من الجوال وثبّته." \
            --latest=false
